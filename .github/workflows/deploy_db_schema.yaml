name: Deploy  Database
on:
  push:
    branches:
      - sprint1
  workflow_dispatch: null
jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install SnowSQL
        run: |
          Invoke-WebRequest -Uri "https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/latest/win64/snowsql.exe" -OutFile "snowsql.exe"
          Start-Process -Wait -FilePath ".\snowsql.exe" -ArgumentList "/S"

      - name: Deploy Snowflake Scripts
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: |
          "C:\Program Files\Snowflake SnowSQL\snowsql.exe" -a ${{ secrets.SNOWFLAKE_ACCOUNT }} `
                                                           -u ${{ secrets.SNOWFLAKE_USER }} `
                                                           -p ${{ secrets.SNOWFLAKE_PASSWORD }} `
                                                           -r ${{ secrets.SNOWFLAKE_ROLE }} `
                                                           -f create_db.sql
