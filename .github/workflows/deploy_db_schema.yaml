---
name: Deploy  Database
on:
  push:
    branches:
      - sprint1
  workflow_dispatch: null
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Install SnowSQL with Debugging
        run: |
          export SNOWSQL_DEST="$HOME/snowsql"
          export SNOWSQL_LOGIN_SHELL="$HOME/.bashrc"
          mkdir -p $HOME/snowsql
          cd $HOME/snowsql
          curl -O https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.3/linux_x86_64/snowsql-1.3.3-linux_x86_64.bash
          chmod +x snowsql-1.3.3-linux_x86_64.bash
          ./snowsql-1.3.3-linux_x86_64.bash  --install-dir=$HOME/snowsql > install_log.txt 2>&1 || cat install_log.txt
          echo "$HOME/.snowsql/bin" >> $GITHUB_PATH  
         
      - name: Check SnowSQL Installation
        run: |
          cd /home/runner/snowsql 
          ./snowsql --version    
      - name: Set Environment Variables
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}          
        run: |
          echo "SNOWSQL_PWD=${{ secrets.SNOWFLAKE_PASSWORD }}" >> $GITHUB_ENV   
      - name: Debug GitHub Workspace
        run: |
         echo "GitHub Workspace Path: $GITHUB_WORKSPACE"
         ls -l $GITHUB_WORKSPACE
      - name: Deploy Database and Schema
        run: |
          exit 0
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
          cd /home/runner/snowsql
          ./snowsql -a ${{ secrets.SNOWFLAKE_ACCOUNT }} \
          -u ${{ secrets.SNOWFLAKE_USER }} \
          -f snowflake\create_db.sql   
               
      - name: Deploy Landing  tables
        run: |
          #exit 0
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
          cd /home/runner/snowsql 
          ./snowsql \
          -a "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
          -u "${{ secrets.SNOWFLAKE_USER }}" \
          -d "${{ secrets.DB_NAME }}" \
          -s "${{ secrets.LANDING_SCHEMA }}" \
          -o log_level=DEBUG \
          -f "${GITHUB_WORKSPACE}/snowdb/1.Landing_zone/landing_master.sql" 
      - name: DeployING staging  tables
        run: |
          #exit 0
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
          cd /home/runner/snowsql 
          ./snowsql \
          -a "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
          -u "${{ secrets.SNOWFLAKE_USER }}" \
          -d "${{ secrets.DB_NAME }}" \
          -s "${{ secrets.LANDING_SCHEMA }}" \
          -o log_level=DEBUG \
          -f "${GITHUB_WORKSPACE}/snowdb/2.Staging_zone/staging_master.sql" 
      - name: DeployING rawvault  tables
        run: |
          #exit 0
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
          cd /home/runner/snowsql 
          ./snowsql \
          -a "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
          -u "${{ secrets.SNOWFLAKE_USER }}" \
          -d "${{ secrets.DB_NAME }}" \
          -s "${{ secrets.LANDING_SCHEMA }}" \
          -o log_level=DEBUG \
          -f "${GITHUB_WORKSPACE}/snowdb/3.Rawvault_zone/rawvault_master.sql"           
      - name: DeployING BusinessVault tables
        run: |
          #exit 0
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
          cd /home/runner/snowsql 
          ./snowsql \
          -a "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
          -u "${{ secrets.SNOWFLAKE_USER }}" \
          -d "${{ secrets.DB_NAME }}" \
          -s "${{ secrets.LANDING_SCHEMA }}" \
          -o log_level=DEBUG \
          -f "${GITHUB_WORKSPACE}/snowdb/4.Businessvault_zone/business_vault_master.sql"    
      - name: altering tables
        run: |
          #exit 0
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
          cd /home/runner/snowsql 
          ./snowsql \
          -a "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
          -u "${{ secrets.SNOWFLAKE_USER }}" \
          -d "${{ secrets.DB_NAME }}" \
          -s "${{ secrets.LANDING_SCHEMA }}" \
          -o log_level=DEBUG \
          -f "${GITHUB_WORKSPACE}/snowdb/alter_master.sql"  
      - name: Deploying Stored Procedures
        run: |
          #exit 0
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
          cd /home/runner/snowsql 
          ./snowsql \
          -a "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
          -u "${{ secrets.SNOWFLAKE_USER }}" \
          -d "${{ secrets.DB_NAME }}" \
          -s "${{ secrets.LANDING_SCHEMA }}" \
          -o log_level=DEBUG \
          -f "${GITHUB_WORKSPACE}/snowdb/stored_procs/Load_stage.sql"
             
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name:  Install Dependencies
        run: |
          pip install snowflake-connector-python pandas requests
      - name: Set Debug Mode
        run: echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
      - name: Load landing tables
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_DATABASE: ${{ secrets.DB_NAME }}
          SNOWFLAKE_SCHEMA: ${{ secrets.LANDING_SCHEMA }}
          SNOWFLAKE_STAGE: ${{ secrets.SNOWFLAKE_STAGE }}            
        run: python ${GITHUB_WORKSPACE}/ETL/python/load_stage_table.py    
      - name: Load Staging tables

        

